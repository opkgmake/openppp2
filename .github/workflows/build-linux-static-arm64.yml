name: Build Linux ARM64 (glibc cross-compile)

on:
  push:
    branches: [ static-arm64 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake make python3 autoconf automake libtool

      - name: Build OpenSSL for ARM64
        run: |
          git clone --depth 1 --branch openssl-3.1.5 https://github.com/openssl/openssl.git
          cd openssl
          ./Configure linux-aarch64 --prefix=$PWD/../openssl-arm64 no-shared no-tests CC=aarch64-linux-gnu-gcc RANLIB=aarch64-linux-gnu-ranlib AR=aarch64-linux-gnu-ar
          make -j$(nproc) && make install_sw

      - name: Build Boost for ARM64
        run: |
          git clone --depth 1 --branch boost-1.84.0 https://github.com/boostorg/boost.git boost_1_84_0
          cd boost_1_84_0
          git submodule update --init --recursive
          ./bootstrap.sh --with-libraries=system,context,filesystem,program_options,regex,serialization,thread,date_time,atomic,chrono,log,random,test --prefix=$PWD/../boost-arm64
          echo "using gcc : aarch64 : aarch64-linux-gnu-g++ ;" > user-config.jam
          ./b2 -j$(nproc) toolset=gcc-aarch64 architecture=arm address-model=64 abi=aapcs \
            --user-config=user-config.jam \
            cxxflags="-fPIC" linkflags="-fPIC" \
            variant=release threading=multi link=static runtime-link=static \
            install

      - name: Build jemalloc for ARM64
        run: |
          git clone --depth 1 --branch 5.3.0 https://github.com/jemalloc/jemalloc.git
          cd jemalloc
          ./autogen.sh --host=aarch64-linux-gnu CC=aarch64-linux-gnu-gcc AR=aarch64-linux-gnu-ar RANLIB=aarch64-linux-gnu-ranlib --prefix=$PWD/../jemalloc-arm64 --disable-shared
          make -j$(nproc) && make install

      - name: Patch CMakeLists.txt for cross-compilation
        run: |
          WORKSPACE=$PWD
          THIRD_DIR=$WORKSPACE/third_party
          mkdir -p $THIRD_DIR

          # Create symlinks matching expected directory structure
          mkdir -p $THIRD_DIR/boost/stage
          ln -s $PWD/boost-arm64/include $THIRD_DIR/boost/include
          ln -s $PWD/boost-arm64/lib $THIRD_DIR/boost/stage/lib
          ln -s $PWD/openssl-arm64 $THIRD_DIR/openssl
          ln -s $PWD/jemalloc-arm64 $THIRD_DIR/jemalloc

          # Replace THIRD_PARTY_LIBRARY_DIR default value
          sed -i "s|SET(THIRD_PARTY_LIBRARY_DIR /root/dev|SET(THIRD_PARTY_LIBRARY_DIR $THIRD_DIR|" CMakeLists.txt

          # Fix Boost include path: add /include
          sed -i 's|${THIRD_PARTY_LIBRARY_DIR}/boost$|${THIRD_PARTY_LIBRARY_DIR}/boost/include|' CMakeLists.txt
          sed -i 's|${THIRD_PARTY_LIBRARY_DIR}/boost\r|${THIRD_PARTY_LIBRARY_DIR}/boost/include|' CMakeLists.txt

          # Remove flags that conflict with dynamic linking
          sed -i 's/-static-libstdc++//g' CMakeLists.txt
          sed -i 's/-rdynamic//g' CMakeLists.txt
          sed -i 's/-Wl,-Bstatic//g' CMakeLists.txt
          sed -i 's/-Wl,-Bdynamic//g' CMakeLists.txt
          sed -i '/libc\.a/d' CMakeLists.txt
          sed -i '/unwind/d' CMakeLists.txt

      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF

      - name: Build
        run: |
          cd build && make -j$(nproc)

      - name: Verify & Package
        run: |
          cd build
          echo "=== Looking for ppp binary ==="
          find . -type f -executable | head -20
          find . -name "ppp*" -type f | head -20
          BINARY=$(find . -name "ppp" -type f -executable | head -1)
          if [ -z "$BINARY" ]; then
            echo "ERROR: ppp binary not found in build dir!"
            exit 1
          fi
          echo "Found binary: $BINARY"
          file "$BINARY"
          aarch64-linux-gnu-readelf -h "$BINARY" | head -5
          aarch64-linux-gnu-readelf -d "$BINARY" | grep NEEDED || true
          aarch64-linux-gnu-strip "$BINARY"
          ls -lh "$BINARY"
          cp "$BINARY" ../ppp
          cd ..
          tar czf openppp2-linux-aarch64.tar.gz ppp
          ls -lh openppp2-linux-aarch64.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openppp2-linux-aarch64
          path: openppp2-linux-aarch64.tar.gz
